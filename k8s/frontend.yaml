apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-frontend
  namespace: online-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-frontend
  template:
    metadata:
      labels:
        app: exam-frontend
    spec:
      containers:
        - name: frontend
          image: online-examination-system-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: exam-frontend
  namespace: online-exam
spec:
  selector:
    app: exam-frontend
  ports:
    - port: 5173
      targetPort: 5173
  type: ClusterIP
