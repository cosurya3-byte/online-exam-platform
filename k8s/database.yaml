apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exam-db-pvc
  namespace: online-exam
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-db
  namespace: online-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exam-db
  template:
    metadata:
      labels:
        app: exam-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: examination_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: exam-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/postgresql/data
            - name: database-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d examination_db
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: exam-db-pvc
        - name: database-init
          configMap:
            name: exam-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: exam-db
  namespace: online-exam
spec:
  selector:
    app: exam-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
