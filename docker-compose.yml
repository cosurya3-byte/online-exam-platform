services:
  db:
    image: postgres:17-alpine
    container_name: exam-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: examination_db
    ports:
      - "5433:5432"
    volumes:
      - exam_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d examination_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: exam-backend
    restart: unless-stopped
    environment:
      PORT: 5050
      DB_USER: postgres
      DB_HOST: db
      DB_NAME: examination_db
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "5051:5050"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: exam-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  exam_data:
